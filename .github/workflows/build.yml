---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: build

permissions:
  contents: read

jobs:
  testo:
    uses: yii2-framework/actions/.github/workflows/testo.yml@c9588f9c3c3d595c0544de18066b55d3f5631f54 # main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      concurrency-group: testo-${{ github.workflow }}-${{ github.ref }}
      extensions: runkit7
      php-version: '["8.3","8.4","8.5"]'

  testo-compatibility:
    uses: yii2-framework/actions/.github/workflows/testo.yml@c9588f9c3c3d595c0544de18066b55d3f5631f54 # main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      # The released yiisoft/yii2-bootstrap5 lines require yiisoft/yii2 ^2.0; its `22` branch is the Yii 22 line.
      composer-command: require yiisoft/yii2:22.0.x-dev yiisoft/yii2-bootstrap5:22.x-dev
      concurrency-group: testo-compatibility-${{ github.workflow }}-${{ github.ref }}
      extensions: runkit7
      php-version: '["8.3","8.4","8.5"]'

  testo-crawler:
    uses: yii2-framework/actions/.github/workflows/testo.yml@c9588f9c3c3d595c0544de18066b55d3f5631f54 # main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      composer-command: update --with symfony/css-selector:^6.4 --with symfony/dom-crawler:^6.4
      concurrency-group: testo-crawler-${{ github.workflow }}-${{ github.ref }}
      extensions: runkit7
      php-version: '["8.3","8.4","8.5"]'
