---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: assets

permissions:
  contents: read

jobs:
  assets:
    uses: yii2-framework/actions/.github/workflows/assets.yml@e9c55bac434f8541fcd15d64d67578d16114e5a5 # v2.0.7
    with:
      # Vitest loads Yii JavaScript from vendor/yiisoft/yii2.
      php-version: "8.3"
      install-command: npm ci --ignore-scripts
      commands: |
        npm run lint
        npm run test:js
        npm run test:mutation
        npm run build
      drift-paths: src/assets/yii2-dynamic-form.min.js

  playwright:
    uses: yii2-framework/actions/.github/workflows/playwright.yml@e9c55bac434f8541fcd15d64d67578d16114e5a5 # v2.0.7
    with:
      # The fixture server runs at the minimum supported PHP version.
      php-version: "8.3"
      install-command: npm ci --ignore-scripts
      only-shell: true
      commands: npm run test:browser
      artifact-path: runtime/playwright/
