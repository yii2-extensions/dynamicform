---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: assets

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: assets-${{ github.workflow }}-${{ github.ref }}

jobs:
  assets:
    name: Lint, test and mutation test the plugin; run the PHP-rendered browser acceptance.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vitest loads yii.js, yii.validation.js and yii.activeForm.js from vendor/yiisoft/yii2, and Playwright serves the
      # fixture with this PHP. PHP 8.1 is the supported floor; PHPUnit covers the rendered output on PHP 8.1-8.5.
      - name: Install PHP dependencies.
        uses: yii2-framework/actions/actions/php-setup@f0e06ea5cc965cff4431177d448add7b7c98668b # v2.0.1
        with:
          coverage-driver: none
          php-version: "8.1"

      - name: Install node.js.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies.
        run: npm ci --ignore-scripts

      - name: Lint the plugin, tests, tools and configuration.
        run: npm run lint

      - name: Test JavaScript.
        run: npm run test:js

      - name: Test JavaScript mutations.
        run: npm run test:mutation

      - name: Install Playwright Chromium.
        run: npx playwright install --with-deps chromium

      - name: Run PHP-rendered browser acceptance for the source and minified assets.
        run: npm run test:browser
